<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🌷</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- PANTALLA INICIAL -->
    <section id="inicio" class="pantalla activa">

        <button id="btnInicio">
            Presiona aquí
        </button>

    </section>


    <!-- PANTALLA PRINCIPAL -->
    <section id="contenido" class="pantalla">

        <h1 id="saludo">
            Hola, Sofi
        </h1>


        <!-- JARDÍN -->
        <div class="jardin">

            <!-- Tulipán izquierdo -->
            <div class="tulipan tulipan-1">

                <div class="flor">
                    <span class="petalo petalo-izq"></span>
                    <span class="petalo petalo-centro"></span>
                    <span class="petalo petalo-der"></span>
                </div>

                <div class="tallo"></div>

                <div class="hoja hoja-izq"></div>
                <div class="hoja hoja-der"></div>

            </div>


            <!-- Tulipán central -->
            <div class="tulipan tulipan-2">

                <div class="flor">
                    <span class="petalo petalo-izq"></span>
                    <span class="petalo petalo-centro"></span>
                    <span class="petalo petalo-der"></span>
                </div>

                <div class="tallo"></div>

                <div class="hoja hoja-izq"></div>
                <div class="hoja hoja-der"></div>

            </div>


            <!-- Tulipán derecho -->
            <div class="tulipan tulipan-3">

                <div class="flor">
                    <span class="petalo petalo-izq"></span>
                    <span class="petalo petalo-centro"></span>
                    <span class="petalo petalo-der"></span>
                </div>

                <div class="tallo"></div>

                <div class="hoja hoja-izq"></div>
                <div class="hoja hoja-der"></div>

            </div>

        </div>


        <!-- VERSÍCULO -->
        <div id="versiculo">

            <p>
                “El Señor te bendiga y te guarde.”
            </p>

            <span>
                Números 6:24
            </span>

        </div>


        <!-- BOTONES -->
        <div class="botones">

            <button id="btnConfeti">
                🎉 Confeti
            </button>

            <button id="btnMusica">
                ♫ Reproducir
            </button>

        </div>


        <!-- CONTENEDOR PARA LOS CONFETIS -->
        <div id="confeti-container"></div>


        <!-- REPRODUCTOR DE YOUTUBE -->
        <div class="youtube-container">
            <div id="youtube-player"></div>
        </div>

    </section>


    <!-- API OFICIAL DE YOUTUBE -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
